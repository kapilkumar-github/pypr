# Local development database. Hosting uses Supabase; this is only for dev and tests.
# Start: docker compose up -d    Stop: docker compose stop
services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: pypr
      POSTGRES_PASSWORD: pypr # local only, never used outside this container
      POSTGRES_DB: pypr_dev
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
      # Runs once, when the volume is first created: adds the pypr_test database
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pypr -d pypr_dev']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
